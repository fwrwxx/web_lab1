<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Lab1 - Штифлюк Ольга ІО-31</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          lav: {
            50:  '#f5f3ff',
            100: '#ede9fe',
            200: '#ddd6fe',
            300: '#c4b5fd',
            400: '#a78bfa',
            500: '#8b5cf6',
            600: '#7c3aed',
            700: '#6d28d9',
          },
          sage: {
            50:  '#f0fdf4',
            100: '#dcfce7',
            200: '#bbf7d0',
            300: '#86efac',
            400: '#4ade80',
            500: '#22c55e',
            600: '#16a34a',
            700: '#15803d',
          },
          ink: '#3f3d56',
        },
        fontFamily: {
          sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body {
    background: linear-gradient(135deg, #f5f3ff 0%, #f0fdf4 100%);
    min-height: 100vh;
  }
  #messages::-webkit-scrollbar,
  #users-list::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb,
  #users-list::-webkit-scrollbar-thumb {
    background: #c4b5fd; border-radius: 8px;
  }
  #messages::-webkit-scrollbar-track,
  #users-list::-webkit-scrollbar-track { background: transparent; }

  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg { animation: msg-in .25s ease-out; }
</style>
</head>
<body class="font-sans text-ink">

<!-- ========== ЕКРАН ВХОДУ ========== -->
<div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md
              bg-white/60 backdrop-blur-xl
              border border-white/70
              rounded-3xl
              shadow-[0_8px_40px_-12px_rgba(139,92,246,0.35)]
              p-8 sm:p-10">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center
                  w-14 h-14 rounded-2xl
                  bg-gradient-to-br from-lav-300 to-sage-300
                  mb-4 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
             viewBox="0 0 24 24" stroke-width="2" stroke="white"
             class="w-7 h-7">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M8 10h8M8 14h4m-9 6l3.5-3.5h9A2.5 2.5 0 0 0 18 14V6a2.5 2.5 0 0 0-2.5-2.5h-11A2.5 2.5 0 0 0 2 6v11.5a.5.5 0 0 0 .5.5H3z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-lav-700">Чат-кімната</h1>
      <p class="text-sm text-ink/60 mt-1">Лабораторна №1 · Варіант 5</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-ink/70 mb-1.5">Ім'я користувача</label>
        <input id="username" type="text" placeholder="user1" autocomplete="off"
               class="w-full px-4 py-3 rounded-2xl
                      bg-white/70 border border-lav-200
                      placeholder-ink/30 text-ink
                      focus:outline-none focus:ring-2 focus:ring-lav-300
                      focus:border-transparent transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-ink/70 mb-1.5">Кімната</label>
        <input id="room" type="text" placeholder="room1" autocomplete="off"
               class="w-full px-4 py-3 rounded-2xl
                      bg-white/70 border border-sage-200
                      placeholder-ink/30 text-ink
                      focus:outline-none focus:ring-2 focus:ring-sage-300
                      focus:border-transparent transition-all">
      </div>

      <button id="join-btn"
              class="w-full py-3 rounded-2xl font-semibold text-white
                     bg-gradient-to-r from-lav-400 to-sage-400
                     hover:from-lav-500 hover:to-sage-500
                     active:scale-[0.98]
                     shadow-lg shadow-lav-300/40
                     transition-all duration-200">
        Приєднатись
      </button>

      <p class="text-center text-xs text-ink/50">
        Натисніть
        <kbd class="px-1.5 py-0.5 rounded bg-lav-100 text-lav-700 font-mono text-[11px]">Enter</kbd>
        щоб увійти
      </p>
    </div>
  </div>
</div>

<!-- ========== ЕКРАН ЧАТУ ========== -->
<div id="chat-screen" class="hidden h-screen">

  <!-- Сайдбар -->
  <aside class="w-72 shrink-0 p-4 flex flex-col gap-4
                bg-white/40 backdrop-blur-xl
                border-r border-white/60 h-full">
    <div class="rounded-2xl p-4
                bg-gradient-to-br from-lav-100/80 to-sage-100/80
                border border-white/60 shadow-sm">
      <div class="flex items-center gap-2 text-sm">
        <span class="text-ink/50">Room:</span>
        <span id="room-label" class="font-semibold text-lav-700"></span>
      </div>
      <div class="flex items-center gap-2 text-sm mt-1">
        <span class="text-ink/50">Username:</span>
        <span id="user-label" class="font-semibold text-sage-700"></span>
      </div>
    </div>

    <div class="rounded-2xl p-4 flex-1 overflow-hidden
                bg-white/50 backdrop-blur-md
                border border-white/60 shadow-sm flex flex-col">
      <h4 class="text-xs uppercase tracking-wider font-semibold text-ink/50 mb-3">
        Users in the chatroom
      </h4>
      <ul id="users-list" class="space-y-2 overflow-y-auto pr-1"></ul>
    </div>
  </aside>

  <!-- Основна частина -->
  <section class="flex-1 flex flex-col min-w-0 h-full">
    <div id="messages" class="flex-1 overflow-y-auto p-5 space-y-3"></div>

    <form id="form"
          class="p-4 bg-white/50 backdrop-blur-md
                 border-t border-white/60 flex gap-3">
      <input id="input" type="text" placeholder="Message" autocomplete="off"
             class="flex-1 px-4 py-3 rounded-2xl
                    bg-white/80 border border-lav-200
                    placeholder-ink/30 text-ink
                    focus:outline-none focus:ring-2 focus:ring-lav-300
                    focus:border-transparent transition-all">
      <button id="send" type="submit"
              class="px-6 py-3 rounded-2xl font-semibold text-white
                     bg-gradient-to-r from-lav-400 to-sage-400
                     hover:from-lav-500 hover:to-sage-500
                     active:scale-[0.98]
                     shadow-lg shadow-lav-300/40
                     transition-all duration-200">
        Send
      </button>
    </form>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const loginScreen = document.getElementById('login-screen');
  const chatScreen  = document.getElementById('chat-screen');
  const joinBtn     = document.getElementById('join-btn');
  const usernameEl  = document.getElementById('username');
  const roomEl      = document.getElementById('room');
  const roomLabel   = document.getElementById('room-label');
  const userLabel   = document.getElementById('user-label');
  const usersList   = document.getElementById('users-list');
  const messages    = document.getElementById('messages');
  const form        = document.getElementById('form');
  const input       = document.getElementById('input');

  // ---- Приєднання ----
  function tryJoin() {
    const username = usernameEl.value.trim() || 'user1';
    const room     = roomEl.value.trim()     || 'room1';

    socket.emit('join', { username, room });

    roomLabel.textContent = room;
    userLabel.textContent = username;

    loginScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    // chat-screen уже flex через Tailwind? - ні, додаємо flex вручну
    chatScreen.classList.add('flex');
    input.focus();
  }

  joinBtn.addEventListener('click', tryJoin);

  // Enter на будь-якому полі екрана входу
  [usernameEl, roomEl].forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); tryJoin(); }
    });
  });

  // ---- Відправка повідомлення ----
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const msg = input.value.trim();
    if (!msg) return;
    socket.emit('chat message', msg);
    input.value = '';
    input.focus();
  });

  // ---- Стилі повідомлень ----
  const msgStyles = {
    admin: {
      wrap: 'bg-gradient-to-br from-lav-100/90 to-lav-200/80 border border-lav-200/70 text-ink',
      meta: 'text-lav-700/70',
    },
    user: {
      wrap: 'bg-gradient-to-br from-sage-100/90 to-sage-200/80 border border-sage-200/70 text-ink',
      meta: 'text-sage-700/80',
    },
  };

  // ---- Прийом повідомлень ----
  socket.on('message', (data) => {
    const style   = msgStyles[data.type] || msgStyles.user;
    const isAdmin = data.type === 'admin';

    // Обгортка вирівнювання
    const row = document.createElement('div');
    row.className = isAdmin
      ? 'flex justify-center'    // admin (у т.ч. авто) - ПО ЦЕНТРУ
      : 'flex justify-start';    // user - зліва

    const div = document.createElement('div');
    div.className = [
      'msg rounded-2xl px-4 py-3 backdrop-blur-sm shadow-sm',
      'max-w-[80%] sm:max-w-[60%]',
      isAdmin ? 'text-center' : '',
      style.wrap,
    ].join(' ');
    div.innerHTML = `
      <div class="flex items-center gap-2 text-xs font-medium ${style.meta} mb-1
                  ${isAdmin ? 'justify-center' : ''}">
        <span>${escapeHtml(data.user)}</span>
        <span class="opacity-60">·</span>
        <span>${escapeHtml(data.time)}</span>
      </div>
      <div class="text-[15px] leading-snug break-words">${escapeHtml(data.text)}</div>
    `;

    row.appendChild(div);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  });

  // ---- Оновлення списку користувачів ----
  socket.on('roomUsers', ({ users }) => {
    usersList.innerHTML = '';
    users.forEach(u => {
      const li = document.createElement('li');
      li.className = 'px-3 py-2 rounded-xl text-sm font-medium '
                   + 'bg-white/70 border border-white/80 text-ink/80 '
                   + 'shadow-sm flex items-center gap-2';
      li.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-sage-400 shadow-[0_0_0_3px_rgba(74,222,128,0.25)]"></span>
        ${escapeHtml(u)}
      `;
      usersList.appendChild(li);
    });
  });

  // ---- XSS-захист ----
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
